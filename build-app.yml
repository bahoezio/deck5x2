# Baut die Windows-App (Deck5x2.exe) automatisch auf GitHub.
# - Bei jedem Push: die .exe liegt unter "Actions" -> letzter Lauf -> "Artifacts".
# - Bei einem Tag wie v0.2.0: zusaetzlich ein Release mit der .exe zum Herunterladen.
name: Windows-App bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller==6.16.0

      - name: .exe bauen
        working-directory: app
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name Deck5x2
          --icon assets/deck.ico
          --add-data "ui;ui"
          --add-data "assets;assets"
          deck_app.py

      - uses: actions/upload-artifact@v4
        with:
          name: Deck5x2-windows
          path: app/dist/Deck5x2.exe

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/Deck5x2.exe
          generate_release_notes: true
